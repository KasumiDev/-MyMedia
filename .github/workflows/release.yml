name: Release extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify release version
        shell: bash
        run: |
          package_tag="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$package_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_tag."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify extension
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Package Chrome extension
        run: |
          npm run zip
          mkdir release
          cp .output/*-chrome.zip release/fansly-mymedia-chrome.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release/fansly-mymedia-chrome.zip
          --generate-notes
          --title "Fansly MyMedia ${{ github.ref_name }}"
          --verify-tag
